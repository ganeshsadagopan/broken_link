<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Broken Link Testing Demo</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 20px;
            color: white;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .card {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .valid {
            background-color: #e6fffa;
            border-left: 6px solid #38b2ac;
        }

        .broken {
            background-color: #fff5f5;
            border-left: 6px solid #e53e3e;
        }

        a {
            text-decoration: none;
            font-weight: bold;
            color: #2b6cb0;
        }

        .status {
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🔗 Broken Link Testing Page</h1>
    <p>Sample UI for Selenium Automation Practice</p>
</header>

<div class="container">

    <div class="card valid">
        <a href="https://www.google.com" target="_blank">Google</a>
        <span class="status">Expected: Valid</span>
    </div>

    <div class="card valid">
        <a href="https://www.amazon.in" target="_blank">Amazon</a>
        <span class="status">Expected: Valid</span>
    </div>

    <div class="card broken">
        <a href="https://www.thispagedoesnotexist123.com" target="_blank">Fake Website</a>
        <span class="status">Expected: Broken</span>
    </div>

    <div class="card broken">
        <a href="https://httpstat.us/404" target="_blank">404 Error Page</a>
        <span class="status">Expected: Broken</span>
    </div>

    <div class="card broken">
        <a href="https://httpstat.us/500" target="_blank">500 Server Error</a>
        <span class="status">Expected: Broken</span>
    </div>

</div>

<footer>
    © 2026 Selenium Practice | Designed for Interview Demo
</footer>

</body>
</html>
